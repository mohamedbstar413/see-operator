# This rule is not used by the project see-op itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the see-operator.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: see-op
    app.kubernetes.io/managed-by: kustomize
  name: seeoperator-editor-role
rules:
- apiGroups:
  - see-operator.example.com
  resources:
  - seeoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - see-operator.example.com
  resources:
  - seeoperators/status
  verbs:
  - get
